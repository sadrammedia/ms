<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="overflow-hidden bg-slate-100">

    <!-- Hero Cover Section -->
    <section id="hero-cover" class="relative w-full h-screen flex items-center justify-center bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1519741497674-611481863552?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');">
        <div class="absolute inset-0 bg-black/40"></div>
        <div class="glass-card relative z-10 text-center p-8 md:p-12 mx-4 max-w-lg w-full rounded-3xl shadow-2xl transition-all duration-700">
            <p class="text-sm md:text-base text-gray-200 mb-2 uppercase tracking-widest">The Wedding Of</p>
            <h1 id="teks-mempelai" class="text-4xl text-white font-serif mb-2">Mardas & Sari</h1>
            
            <!-- Elemen tanggal baru ditambahkan di sini -->
            <p id="teks-tanggal" class="text-gray-600 mb-6">16 April 2030</p>

            <div class="my-6">
                <p class="text-gray-300 text-sm">Kepada Yth. Bapak/Ibu/Saudara/i</p>
                <h2 id="nama-tamu" class="text-2xl text-white font-semibold mt-2">-</h2>
            </div>
            <button id="btn-buka" class="rounded-full bg-white text-gray-900 px-8 py-3 font-semibold hover:bg-gray-200 transition-colors shadow-lg flex items-center justify-center mx-auto gap-2">
                Buka Undangan
            </button>
        </div>
    </section>

    <!-- Main Content Area (Hanya satu tag main ini saja) -->
    <main id="main-content" class="hidden relative z-10 w-full bg-slate-50 min-h-screen py-16">
        <div class="container mx-auto px-4 max-w-2xl">
            <!-- RSVP Section -->
            <div class="bg-white/60 backdrop-blur-md border border-white/40 shadow-xl rounded-3xl p-8">
                <h2 class="text-3xl font-serif text-center text-gray-800 mb-6">Buku Tamu & RSVP</h2>
                <form id="rsvp-form" class="space-y-5">
                    <div>
                        <input type="text" id="nama-kehadiran" name="nama" required placeholder="Nama Lengkap Anda" class="w-full px-6 py-3 rounded-full bg-white border border-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all">
                    </div>
                    <div>
                        <select id="status-kehadiran" name="status" required class="w-full px-6 py-3 rounded-full bg-white border border-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all appearance-none">
                            <option value="" disabled selected>Apakah Anda akan hadir?</option>
                            <option value="Hadir">Ya, Saya akan hadir</option>
                            <option value="Tidak Hadir">Maaf, saya tidak bisa hadir</option>
                        </select>
                    </div>
                    <div>
                        <textarea id="pesan-kehadiran" name="pesan" rows="4" required placeholder="Tuliskan ucapan & doa untuk mempelai..." class="w-full px-6 py-4 rounded-3xl bg-white border border-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all resize-none"></textarea>
                    </div>
                    <button type="submit" id="btn-submit" class="w-full rounded-full bg-gray-900 text-white px-8 py-3 font-semibold hover:bg-gray-800 transition-colors shadow-lg flex items-center justify-center gap-2">
                        Kirim Ucapan
                    </button>
                </form>
            </div>
        

            <!-- Guestbook / Daftar Ucapan Section -->
            <div class="mt-8 bg-white/60 backdrop-blur-md border border-white/40 shadow-xl rounded-3xl p-8">
                <h3 class="text-2xl font-serif text-gray-800 mb-6 flex items-center gap-2">
                    <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
                    Pesan & Doa
                </h3>
                    
                <!-- Container list dengan custom scrollbar -->
                <div id="daftar-ucapan" class="space-y-4 max-h-[400px] overflow-y-auto pr-3 custom-scrollbar">
                    <!-- Efek Loading Skeleton Premium -->
                    <div class="animate-pulse flex space-x-4 p-5 bg-white/50 rounded-2xl">
                        <div class="flex-1 space-y-4 py-1">
                            <div class="h-4 bg-slate-300 rounded w-1/4"></div>
                            <div class="space-y-2">
                                <div class="h-3 bg-slate-300 rounded"></div>
                                <div class="h-3 bg-slate-300 rounded w-5/6"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>            
        </div>
    </main>

    <!-- Pindahkan script js ke baris ini -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
