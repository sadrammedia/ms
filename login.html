<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - MS Undangan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom Style / Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-slate-900 bg-cover bg-center min-h-screen flex items-center justify-center p-4" style="background-image: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1519741497674-611481863552?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');">

    <div class="bg-white/90 backdrop-blur-md border border-white/20 shadow-2xl rounded-3xl p-8 md:p-10 max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-serif text-gray-900 mb-2">MS Admin</h1>
            <p class="text-sm text-gray-500">Masuk untuk mengelola sistem undangan klien.</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1 pl-2">Email Administrator</label>
                <input type="email" id="email" required class="w-full px-5 py-3.5 rounded-full border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-gray-800 bg-white/50 text-sm" placeholder="nama@domain.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1 pl-2">Kata Sandi</label>
                <input type="password" id="password" required class="w-full px-5 py-3.5 rounded-full border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-gray-800 bg-white/50 text-sm" placeholder="••••••••">
            </div>
            <button type="submit" id="btn-login" class="w-full py-4 bg-indigo-600 text-white rounded-full font-semibold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-600/30 text-sm">
                Masuk ke Dasbor
            </button>
        </form>
    </div>

    <!-- Script Logika Login -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
